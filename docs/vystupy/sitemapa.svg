<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .ht { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .hs { font-size: 12px; fill: #cbd5e1; }
      .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .page { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .pub { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
      .dlg { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .key { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.6; }
      .head { fill: #1e293b; }
      .ln { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .arr { stroke: #64748b; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1040" height="650" fill="#ffffff"/>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#0f172a">TrainLoop — sitemapa</text>
  <text x="40" y="54" class="s">Struktura obrazovek a jak na sebe navazují · popis v sitemapa.md</text>

  <!-- Veřejná část -->
  <text x="40" y="84" class="lbl">VEŘEJNÁ ČÁST</text>
  <rect x="40" y="94" width="176" height="48" rx="8" class="pub"/>
  <text x="56" y="123" class="t">Úvodní stránka</text>
  <rect x="236" y="94" width="176" height="48" rx="8" class="pub"/>
  <text x="252" y="123" class="t">Registrace</text>
  <rect x="432" y="94" width="176" height="48" rx="8" class="pub"/>
  <text x="448" y="123" class="t">Přihlášení</text>
  <rect x="628" y="94" width="176" height="48" rx="8" class="pub"/>
  <text x="644" y="123" class="t">Obnova hesla</text>
  <rect x="824" y="94" width="176" height="48" rx="8" class="pub"/>
  <text x="840" y="123" class="t">Přijetí pozvánky</text>

  <line x1="216" y1="118" x2="234" y2="118" class="arr" marker-end="url(#arrow)"/>
  <line x1="608" y1="118" x2="626" y2="118" class="arr" marker-end="url(#arrow)"/>

  <path d="M520,142 V162 H150 V178" class="arr" marker-end="url(#arrow)"/>
  <text x="528" y="158" class="s">po přihlášení</text>

  <!-- Hlavní navigace -->
  <text x="290" y="174" class="lbl">HLAVNÍ NAVIGACE</text>
  <rect x="40" y="180" width="220" height="52" rx="8" class="head"/>
  <text x="56" y="203" class="ht">Týden</text>
  <text x="56" y="221" class="hs">výchozí obrazovka</text>
  <rect x="290" y="180" width="220" height="52" rx="8" class="head"/>
  <text x="306" y="203" class="ht">Psi</text>
  <text x="306" y="221" class="hs">moji i nasdílení psi</text>
  <rect x="540" y="180" width="220" height="52" rx="8" class="head"/>
  <text x="556" y="203" class="ht">Klienti</text>
  <text x="556" y="221" class="hs">jen trenér</text>
  <rect x="790" y="180" width="210" height="52" rx="8" class="head"/>
  <text x="806" y="203" class="ht">Účet</text>
  <text x="806" y="221" class="hs">profil, heslo, smazání</text>

  <!-- Týden -->
  <path d="M50,232 V352 M50,292 H60 M50,352 H60" class="ln"/>
  <rect x="60" y="270" width="200" height="44" rx="8" class="dlg"/>
  <text x="76" y="297" class="t">Zapsat trénink</text>
  <rect x="60" y="330" width="200" height="44" rx="8" class="dlg"/>
  <text x="76" y="357" class="t">Naplánovat trénink</text>

  <!-- Psi -->
  <path d="M300,232 V352 M300,292 H310 M300,352 H310" class="ln"/>
  <rect x="310" y="270" width="200" height="44" rx="8" class="page"/>
  <text x="326" y="297" class="t">Nový pes</text>
  <rect x="310" y="330" width="200" height="44" rx="8" class="page"/>
  <text x="326" y="357" class="t">Detail psa</text>
  <path d="M320,374 V472 M320,412 H330 M320,472 H330" class="ln"/>
  <rect x="330" y="390" width="180" height="44" rx="8" class="page"/>
  <text x="346" y="417" class="t">Sdílení s trenéry</text>
  <rect x="330" y="450" width="180" height="44" rx="8" class="page"/>
  <text x="346" y="477" class="t">Detail cíle (plán)</text>

  <!-- Klienti -->
  <path d="M550,232 V352 M550,292 H560 M550,352 H560" class="ln"/>
  <rect x="560" y="270" width="200" height="44" rx="8" class="dlg"/>
  <text x="576" y="297" class="t">Připojit psa kódem</text>
  <rect x="560" y="330" width="200" height="44" rx="8" class="page"/>
  <text x="576" y="357" class="t">Čeká na reakci</text>

  <!-- Detail úkolu (sdílená obrazovka) -->
  <rect x="330" y="540" width="260" height="48" rx="8" class="key"/>
  <text x="346" y="561" class="t">Detail úkolu</text>
  <text x="346" y="578" class="s">historie tréninků · komentáře</text>

  <line x1="420" y1="494" x2="420" y2="538" class="arr" marker-end="url(#arrow)"/>
  <path d="M160,374 V564 H328" class="arr" marker-end="url(#arrow)"/>
  <text x="168" y="556" class="s">klik na trénink</text>
  <path d="M660,374 V564 H592" class="arr" marker-end="url(#arrow)"/>

  <!-- Legenda -->
  <rect x="40" y="614" width="22" height="14" rx="3" class="pub"/>
  <text x="70" y="626" class="s">veřejná stránka</text>
  <rect x="180" y="614" width="22" height="14" rx="3" class="head"/>
  <text x="210" y="626" class="s">hlavní navigace</text>
  <rect x="320" y="614" width="22" height="14" rx="3" class="page"/>
  <text x="350" y="626" class="s">stránka</text>
  <rect x="420" y="614" width="22" height="14" rx="3" class="dlg"/>
  <text x="450" y="626" class="s">dialog</text>
  <rect x="510" y="614" width="22" height="14" rx="3" class="key"/>
  <text x="540" y="626" class="s">sdílená obrazovka, vede na ni víc cest</text>
</svg>
